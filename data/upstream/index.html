<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mimo-v2.6 RL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Training metrics of the mimo-v2.6-pro and mimo-v2.6-flash reinforcement-learning runs, live from the trainer's logs.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <nav class="tabs" id="tabs">
      <a data-view="overview">overview</a>
      <a data-view="metrics">metrics</a>
      <a data-view="about">about</a>
    </nav>
    <div class="nav-right">
      <div class="nav-status" id="nav-status"></div>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-metrics"></section>
  <section class="view" id="view-about"></section>
</main>

<footer class="wrap foot"><a id="foot-handle" target="_blank" rel="noopener"></a><span id="foot-stream"></span><span id="foot-note"></span></footer>

<div class="modal hidden" id="modal">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div><div class="modal-title mono" id="modal-title"></div><div class="modal-desc" id="modal-desc"></div></div>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <div class="modal-stats mono" id="modal-stats"></div>
    <div class="modal-chart" id="modal-chart"></div>
  </div>
</div>

<div class="status-pill hidden" id="status-pill">reconnecting…</div>

<script src="js/format.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
